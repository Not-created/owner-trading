name: Owner Trading VPS Auto Refresh

on:
  push:
    branches:
      - main
    paths:
      - '**.zip'

  workflow_dispatch:

concurrency:
  group: owner-trading-vps-refresh
  cancel-in-progress: true

jobs:
  refresh-vps:
    runs-on: ubuntu-latest

    steps:
      - name: Refresh VPS source from GitHub
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          echo "=== PREPARE SSH ==="

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$VPS_SSH_PRIVATE_KEY" \
            | base64 --decode \
            > ~/.ssh/owner_trading_github_actions

          chmod 600 ~/.ssh/owner_trading_github_actions

          if ! ssh-keygen -y \
              -f ~/.ssh/owner_trading_github_actions \
              >/dev/null 2>&1; then
            echo "ERROR: VPS_SSH_PRIVATE_KEY is not a valid private SSH key."
            echo "The GitHub Secret must contain the Base64 output of:"
            echo "base64 -w 0 ~/.ssh/github_actions_owner_trading"
            exit 1
          fi

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "=== CONNECT TO VPS ==="

          ssh \
            -i ~/.ssh/owner_trading_github_actions \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          REPO_URL="https://github.com/Not-created/owner-trading.git"
          SOURCE_ROOT="/home/ubuntu/owner-trading"
          RUNTIME_ROOT="/opt/owner-trading"
          EXTRACT_ROOT="/tmp/owner-trading-extract"

          echo "======================================"
          echo "OWNER TRADING VPS AUTO REFRESH"
          echo "======================================"

          echo
          echo "=== CHECK VPS PRIVILEGES ==="

          sudo -n true

          echo
          echo "=== STOP SERVICES ==="

          sudo systemctl stop owner-trading-broker || true
          sudo systemctl stop owner-trading-backend || true

          echo
          echo "=== REMOVE OLD SOURCE ==="

          sudo rm -rf "$SOURCE_ROOT"

          echo
          echo "=== REMOVE OLD RUNTIME ==="

          sudo rm -rf "$RUNTIME_ROOT"

          echo
          echo "=== REMOVE OLD BROKER OVERRIDE ==="

          sudo rm -f \
            /etc/systemd/system/owner-trading-broker.service.d/override.conf

          echo
          echo "=== FRESH GITHUB CLONE ==="

          cd /home/ubuntu

          git clone "$REPO_URL" owner-trading

          cd "$SOURCE_ROOT"

          git checkout main
          git pull --ff-only origin main

          echo
          echo "=== CURRENT GITHUB COMMIT ==="

          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo "$CURRENT_COMMIT"

          echo
          echo "=== FIND ZIP FILES IN CURRENT GITHUB COMMIT ==="

          mapfile -t ZIP_FILES < <(
            git ls-tree -r --name-only HEAD -- '*.zip'
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in the current GitHub commit."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: More than one ZIP file exists in the repository."
            echo "This would make automatic deployment ambiguous."
            echo
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"

          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          if [ ! -f "$SOURCE_ROOT/$ZIP_FILE" ]; then
            echo "ERROR: Selected ZIP does not exist:"
            echo "$SOURCE_ROOT/$ZIP_FILE"
            exit 1
          fi

          echo
          echo "=== ZIP INTEGRITY TEST ==="

          unzip -t -- "$SOURCE_ROOT/$ZIP_FILE"

          echo
          echo "=== PREPARE EXTRACTION DIRECTORY ==="

          sudo rm -rf "$EXTRACT_ROOT"
          sudo mkdir -p "$EXTRACT_ROOT"

          echo
          echo "=== EXTRACT ZIP ==="

          sudo unzip -q \
            -- "$SOURCE_ROOT/$ZIP_FILE" \
            -d "$EXTRACT_ROOT"

          echo
          echo "=== LOCATE PROJECT ROOT ==="

          PROJECT_ROOT="$(
            sudo find "$EXTRACT_ROOT" \
              -type f \
              -name deploy.sh \
              -print -quit |
            xargs -r dirname
          )"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: deploy.sh not found inside ZIP."
            exit 1
          fi

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo
          echo "=== VERIFY REQUIRED PROJECT STRUCTURE ==="

          for required in \
            backend \
            broker-service \
            frontend \
            deployment \
            deploy.sh
          do
            if [ ! -e "$PROJECT_ROOT/$required" ]; then
              echo "ERROR: Missing required item: $required"
              exit 1
            fi
          done

          echo
          echo "=== REPLACE SOURCE WITH EXTRACTED PROJECT ==="

          sudo rsync -a \
            --exclude '.git/' \
            "$PROJECT_ROOT/" \
            "$SOURCE_ROOT/"

          sudo chmod +x "$SOURCE_ROOT/deploy.sh"

          echo
          echo "=== VERIFY FINAL SOURCE ==="

          sudo test -x "$SOURCE_ROOT/deploy.sh"
          sudo test -d "$SOURCE_ROOT/backend"
          sudo test -d "$SOURCE_ROOT/broker-service"
          sudo test -d "$SOURCE_ROOT/frontend"
          sudo test -d "$SOURCE_ROOT/deployment"

          echo
          echo "=== CLEAN EXTRACTION DIRECTORY ==="

          sudo rm -rf "$EXTRACT_ROOT"

          echo
          echo "======================================"
          echo "SOURCE REFRESH COMPLETED SUCCESSFULLY"
          echo "======================================"

          echo
          echo "Git commit:"
          echo "$CURRENT_COMMIT"

          echo
          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          echo
          echo "Deployment has NOT been started automatically."

          echo
          echo "Run manually:"
          echo
          echo "cd /home/ubuntu/owner-trading"
          echo "./deploy.sh"

          REMOTE_SCRIPT
