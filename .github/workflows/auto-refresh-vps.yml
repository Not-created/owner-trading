name: Owner Trading VPS Auto Refresh

on:
  push:
    branches:
      - main
    paths:
      - '**.zip'

  workflow_dispatch:

concurrency:
  group: owner-trading-vps-refresh
  cancel-in-progress: true

jobs:
  refresh-vps:
    runs-on: ubuntu-latest

    steps:
      - name: Refresh VPS source from GitHub
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          echo "=== PREPARE SSH ==="

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$VPS_SSH_PRIVATE_KEY" \
            | base64 --decode \
            > ~/.ssh/owner_trading_github_actions

          chmod 600 ~/.ssh/owner_trading_github_actions

          if ! ssh-keygen -y \
              -f ~/.ssh/owner_trading_github_actions \
              >/dev/null 2>&1; then
            echo "ERROR: VPS_SSH_PRIVATE_KEY is not a valid Base64-encoded private SSH key."
            exit 1
          fi

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          echo "=== CONNECT TO VPS ==="

          ssh \
            -i ~/.ssh/owner_trading_github_actions \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -euo pipefail

          REPO_URL="https://github.com/Not-created/owner-trading.git"

          SOURCE_ROOT="/home/ubuntu/owner-trading"
          RUNTIME_ROOT="/opt/owner-trading"

          WORK_ROOT="/tmp/owner-trading-auto-refresh"
          REPO_ROOT="$WORK_ROOT/repo"
          EXTRACT_ROOT="$WORK_ROOT/extract"
          PROJECT_ROOT=""

          echo "======================================"
          echo "OWNER TRADING VPS AUTO REFRESH"
          echo "======================================"

          echo
          echo "=== CHECK VPS PRIVILEGES ==="

          sudo -n true

          echo
          echo "=== PREPARE TEMPORARY WORKSPACE ==="

          sudo rm -rf "$WORK_ROOT"
          sudo mkdir -p "$REPO_ROOT" "$EXTRACT_ROOT"
          sudo chown -R ubuntu:ubuntu "$WORK_ROOT"

          echo
          echo "=== FRESH GITHUB CLONE ==="

          git clone --branch main --single-branch "$REPO_URL" "$REPO_ROOT"

          cd "$REPO_ROOT"

          CURRENT_COMMIT="$(git rev-parse HEAD)"

          echo
          echo "Current GitHub commit:"
          echo "$CURRENT_COMMIT"

          echo
          echo "=== FIND ZIP IN CURRENT REPOSITORY ==="

          mapfile -d '' ZIP_FILES < <(
            find "$REPO_ROOT" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          ZIP_COUNT="${#ZIP_FILES[@]}"

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo
            echo "No ZIP file is currently present in main."
            echo "This is expected when the previous ZIP was deleted before"
            echo "the replacement ZIP is uploaded."
            echo
            echo "Nothing was changed on the VPS."
            echo "Waiting for the next ZIP upload."
            sudo rm -rf "$WORK_ROOT"
            exit 0
          fi

          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo
            echo "ERROR: Multiple ZIP files found in main."
            echo "Automatic refresh is refusing to guess."
            echo
            printf '%s\n' "${ZIP_FILES[@]}"
            sudo rm -rf "$WORK_ROOT"
            exit 1
          fi

          ZIP_PATH="${ZIP_FILES[0]}"
          ZIP_FILE="$(basename "$ZIP_PATH")"

          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          echo
          echo "=== ZIP INTEGRITY TEST ==="

          unzip -t -- "$ZIP_PATH"

          echo
          echo "=== CHECK ZIP PATH SAFETY ==="

          if unzip -Z1 "$ZIP_PATH" |
              grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "ERROR: Unsafe path detected inside ZIP."
            echo "Refresh refused before touching the existing deployment."
            sudo rm -rf "$WORK_ROOT"
            exit 1
          fi

          echo
          echo "=== EXTRACT ZIP ==="

          unzip -q "$ZIP_PATH" -d "$EXTRACT_ROOT"

          echo
          echo "=== LOCATE PROJECT ROOT ==="

          PROJECT_ROOT="$(
            find "$EXTRACT_ROOT" \
              -type f \
              -name deploy.sh \
              -print -quit |
            xargs -r dirname
          )"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: deploy.sh not found inside ZIP."
            echo "Existing VPS deployment was NOT changed."
            sudo rm -rf "$WORK_ROOT"
            exit 1
          fi

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo
          echo "=== VERIFY REQUIRED PROJECT STRUCTURE ==="

          for required in \
            backend \
            broker-service \
            frontend \
            deployment \
            deploy.sh
          do
            if [ ! -e "$PROJECT_ROOT/$required" ]; then
              echo "ERROR: Missing required item: $required"
              echo "Existing VPS deployment was NOT changed."
              sudo rm -rf "$WORK_ROOT"
              exit 1
            fi
          done

          echo
          echo "=== VALIDATION COMPLETE ==="
          echo "The new ZIP passed all pre-delete checks."

          echo
          echo "=== STOP SERVICES ==="

          sudo systemctl stop owner-trading-broker || true
          sudo systemctl stop owner-trading-backend || true

          echo
          echo "=== REMOVE OLD SOURCE ==="

          sudo rm -rf "$SOURCE_ROOT"

          echo
          echo "=== REMOVE OLD RUNTIME ==="

          sudo rm -rf "$RUNTIME_ROOT"

          echo
          echo "=== REMOVE OLD BROKER OVERRIDE ==="

          sudo rm -f \
            /etc/systemd/system/owner-trading-broker.service.d/override.conf

          echo
          echo "=== INSTALL VALIDATED PROJECT ==="

          sudo mkdir -p "$SOURCE_ROOT"

          sudo cp -a \
            "$PROJECT_ROOT"/. \
            "$SOURCE_ROOT"/

          sudo chmod +x "$SOURCE_ROOT/deploy.sh"

          echo
          echo "=== VERIFY INSTALLED SOURCE ==="

          sudo test -x "$SOURCE_ROOT/deploy.sh"
          sudo test -d "$SOURCE_ROOT/backend"
          sudo test -d "$SOURCE_ROOT/broker-service"
          sudo test -d "$SOURCE_ROOT/frontend"
          sudo test -d "$SOURCE_ROOT/deployment"

          echo
          echo "=== CLEAN TEMPORARY WORKSPACE ==="

          sudo rm -rf "$WORK_ROOT"

          echo
          echo "======================================"
          echo "SOURCE REFRESH COMPLETED SUCCESSFULLY"
          echo "======================================"

          echo
          echo "Git commit:"
          echo "$CURRENT_COMMIT"

          echo
          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          echo
          echo "Deployment was NOT started automatically."

          echo
          echo "Run manually:"
          echo
          echo "cd /home/ubuntu/owner-trading"
          echo "./deploy.sh"

          REMOTE_SCRIPT
